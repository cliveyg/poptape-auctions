services:
  auctioneer:
    build:
      context: .
      dockerfile: Dockerfile
    image: poptape/auctioneer:v${VERSION}
    environment:
      - "PORT=${PORT}"
    ports:
      - "1252:${PORT}"
    #volumes:
    #  - ${LOCAL_LOG_LOC}:/auctioneer/log/auctioneer.log
    restart: always
    networks:
      - poptape
networks:
  poptape:
    external: true